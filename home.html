<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adventure Belajar</title>

    <link rel="stylesheet" href="css/home.css" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Pastikan pembungkus papan nama menjadi acuan posisi absolut */
        .papan-nama-wrap {
            position: relative;
            display: inline-block;
        }

        .user-text-container {
            position: absolute;
            top: 50%;
            left: 53%;
            /* Agak digeser ke kanan menghindari avatar */
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 55%;
            /* Batasi area teks agar tidak menabrak daun di kanan */
            z-index: 2;
            text-align: center;
        }

        .nama-text {
            font-size: 14px;
            font-weight: 800;
            color: #333;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            /* Otomatis jadi ... kalau nama kepanjangan */
            width: 100%;
        }

        .email-text {
            font-size: 11px;
            color: #555;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
    </style>
</head>

<body>
    <!-- Sun -->
    <div class="sun"></div>

    <!-- Settings -->
    <button class="settings-btn" title="Pengaturan">⚙️</button>

    <!-- LAYOUT -->
    <div class="layout">
        <!-- MAIN BOARD -->
        <div class="main-board">
            <div class="board-frame">
                <!-- Inner parchment area -->
                <div class="board-inner">
                    <div class="board-subtitle">FOTOSINTESIS 🌟</div>

                    <div class="menu-grid">
                        <a href="materi.html" class="menu-card">
                            <img src="assets/home/materi.png" alt="Hutan Pelajaran" class="card-img">
                        </a>
                        <a href="quiz.html" class="menu-card">
                            <img src="assets/home/kuis.png" alt="Tebing Kuis" class="card-img">
                        </a>
                        <a href="video.html" class="menu-card">
                            <img src="assets/home/teman-aktivitas.png" alt="Taman Aktivitas" class="card-img">
                        </a>
                        <a href="game.html" class="menu-card">
                            <img src="assets/home/desa-presetasi.png" alt="Desa Prestasi" class="card-img">
                        </a>
                    </div>
                </div>
            </div>

            <img src="assets/home/progress_bar.png" alt="Kemajuan Petualangan" class="progress-label">
            <div class="progress-panel">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill"></div>
                    <div class="bird">🐦</div>
                </div>
            </div>
        </div>
    </div>

    <!-- CHARACTER AREA -->
    <div class="character-area">
        <div class="papan-nama-wrap">
            <img src="assets/home/papan_nama.png" alt="Papan Nama" class="papan-nama-img">

            <!-- Area Text Nama & Email -->
            <div class="user-text-container">
                <span class="nama-text" id="display-nama">Nama Google</span>
                <span class="email-text" id="display-email">email@google.com</span>
            </div>
        </div>
        <img src="assets/home/kelinci.png" alt="Kelinci" class="kelinci-img">
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-area">
        <div class="mission-panel">
            <div class="mission-title">📋 Misi Hari Ini</div>
            <div class="mission-item">
                <span>✅</span>
                <span>Selesaikan 1 Pelajaran!</span>
            </div>
        </div>
    </div>

    <!-- Script untuk Mengambil Data dari LocalStorage -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Ambil data yang disimpan saat login di index.html
            const nama = localStorage.getItem("userNama");
            const email = localStorage.getItem("userEmail");

            // Jika ada datanya, ganti teks default dengan data tersebut
            if (nama) {
                document.getElementById("display-nama").innerText = nama;
            }
            if (email) {
                document.getElementById("display-email").innerText = email;
            }
        });
    </script>
</body>

</html>
