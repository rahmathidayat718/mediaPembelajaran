<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Adventure Belajar</title>

    <link rel="stylesheet" href="css/home.css" />

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <section class="dashboard">

        <!-- LEFT -->
        <aside class="sidebar">

            <!-- PROFILE -->
            <div class="profile-card">

                <div class="avatar">
                    👦
                </div>

                <div class="profile-info">

                    <h2>NAMA ANAK</h2>

                    <p>Adventure Level 1</p>

                    <div class="xp-bar">
                        <div class="xp-fill"></div>
                    </div>

                </div>

            </div>

            <!-- MASKOT -->
            <div class="mascot">
                🐻
            </div>

            <!-- MENU -->
            <div class="side-menu">

                <a href="#">
                    📍 Peta Adventure
                </a>

                <a href="#">
                    🏆 Skor Saya
                </a>

                <a href="#">
                    👤 Profil
                </a>

                <a href="#">
                    🛒 Fantasy Shop
                </a>

            </div>

        </aside>

        <!-- CENTER -->
        <main class="main-content">

            <!-- TITLE -->
            <div class="wood-title">

                🌱 MENU PETUALANGAN BELAJAR 🌱

            </div>

            <!-- MAIN PANEL -->
            <div class="main-panel">

                <h1>
                    AYO MULAI PETUALANGAN!
                </h1>

                <!-- GRID -->
                <div class="menu-grid">

                    <a href="#" class="menu-card green">

                        <div class="icon">📚</div>

                        <h2>Hutan Pelajaran</h2>

                    </a>

                    <a href="#" class="menu-card blue">

                        <div class="icon">🎯</div>

                        <h2>Tebing Kuis</h2>

                    </a>

                    <a href="#" class="menu-card orange">

                        <div class="icon">🎨</div>

                        <h2>Taman Aktivitas</h2>

                    </a>

                    <a href="#" class="menu-card red">

                        <div class="icon">🏆</div>

                        <h2>Desa Prestasi</h2>

                    </a>

                </div>

                <!-- PROGRESS -->
                <div class="progress-section">

                    <h3>KEMAJUAN PETUALANGAN</h3>

                    <div class="progress-bar">

                        <div class="progress-fill2"></div>

                    </div>

                </div>

            </div>

        </main>

        <!-- RIGHT -->
        <aside class="mission-box">

            <h2>
                🎯 Misi Hari Ini
            </h2>

            <p>
                ✔ Selesaikan 1 Pelajaran!
            </p>

        </aside>

    </section>

</body>

</html>
