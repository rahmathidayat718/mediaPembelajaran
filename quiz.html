<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Quiz Pembelajaran</h1>

        <div id="start-container">

            <input type="text" id="student-name" placeholder="Masukkan nama">

            <br><br>

            <button id="start-btn">
                Mulai Quiz
            </button>

        </div>

        <div id="quiz-container" style="display: none;">

            <p id="progress"></p>

            <p id="timer">
                Waktu: 30
            </p>

            <h2 id="question"></h2>

            <div id="answer-buttons"></div>

            <br>

            <button id="next-btn">
                Soal Berikutnya
            </button>

        </div>

        <div id="result-container" style="display: none;">

            <h2>Quiz Selesai</h2>

            <p id="final-name"></p>

            <p id="score"></p>

            <button onclick="restartQuiz()">
                Ulangi Quiz
            </button>

        </div>

    </div>

    <script src="js/quiz.js"></script>

</body>

</html>
