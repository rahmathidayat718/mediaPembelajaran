<!DOCTYPE html>
<html>

<head>
    <title>Quiz</title>
</head>

<body>

    <h1>Quiz</h1>

    <p>2 + 2 = ?</p>

    <button onclick="cekJawaban(4)">4</button>
    <button onclick="cekJawaban(5)">5</button>

    <script>
        function cekJawaban(jawaban) {
            if (jawaban == 4) {
                alert("Benar!");
            } else {
                alert("Salah!");
            }
        }
    </script>

</body>

</html>
